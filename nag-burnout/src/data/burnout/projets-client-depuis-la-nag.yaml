title: "Projets client depuis la nag"
explanation:
  - "La possibilité de changer de client augmente l'anxiété face à l'imprévu par rapport aux conditions, aux collègues et à l'ambiance générale."
  - "Garder la possibilité de rester à la nag, dans un environnement sécurisant, permettrait de réduire ce stress."
examples:
  - situation: "Open space Helvetia"
    what_happens:
      - "Trop grands, trop froids, trop de monde. Surcharge sensorielle et sociale, interruptions plus fréquentes."
  - situation: "Pauses"
    what_happens:
      - "Les centres d'intérêts sont plus différents avec les collègues HV, du coup les pauses sont presque plus fatigantes que le travail."
  - situation: "Collègues moins présents"
    what_happens:
      - 'Du fait du flex office, certains collègues sont croisés moins souvent (1 ou 2 fois / mois). Cela entraîne une sociabilisation "forcée" (comment ça va, qu''est-ce que tu deviens, etc.) qui n''est pas forcément au bon moment. Je suis interrompu dans mon travail et l''effort de reconcentration est difficile.'
