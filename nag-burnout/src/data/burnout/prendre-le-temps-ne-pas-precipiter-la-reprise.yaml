title: "Prendre le temps, ne pas précipiter la reprise"
explanation:
  - "La fatigue est persistante malgré une longue absence."
  - "Le problème est structurel dans tous les domaines de la vie, ce n'est pas uniquement un manque de repos."
examples:
  - situation: "Préparer ce document"
    what_happens:
      - "Grande consommation d'énergie. Obsession de finir. Absence mentale le reste du temps"
