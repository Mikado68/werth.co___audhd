title: "Sécuriser mon retour"
explanation:
  - "Le retour au travail est plein de peur et génère de l'anxiété, ce qui est paradoxal."
  - "De manière générale, les incertitudes autour de mon retour et aux conditions dans lesquelles il va s'effectuer sont une surcharge cognitive."
examples:
  - situation: "Inconnu par rapport au projet"
    what_happens:
      - "Vais-je continuer sur CRIS ? Chez un autre client ? Quelles vont être mes tâches ?"
  - situation: "Temps partiel"
    what_happens:
      - "Comment répartir le travail ?"
  - situation: "Compréhension & adaptations"
    what_happens:
      - "Malgré toute la bienveillance et la préoccupation que je peux ressentir, vais-je être compris ou jugé ? À quel point mon poste est-il adaptable ? Vais-je être stigmatisé ou inclus ?"
  - situation: "Peur de l'avenir"
    what_happens:
      - "Vais-je y arriver sur le long terme ? Vais-je garder mon emploi ?"
