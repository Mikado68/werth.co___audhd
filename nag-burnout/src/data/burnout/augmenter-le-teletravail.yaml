title: "Augmenter le télétravail"
explanation:
  - "J'ai un besoin de routine pour réduire la charge cognitive."
  - "Le télétravail me permet d'évoluer dans un cadre rassurant et familier."
  - "Le présentiel génère de la fatigue sociale et une surcharge cognitive, à la fois dans les bureaux, mais aussi lors des transports."
examples:
  - situation: "Transport jusqu'au travail"
    what_happens:
      - "Fatigue sociale : trop de monde dans le train, être assis à côté d'inconnus. Le moindre imprévu (retard ou annulation du train, accident, bouchon) génère une surcharge cognitive. Arrivé au travail, mes réserves d'adaptation sont déjà bien épuisées"
  - situation: "Bureaux pleins de monde"
    what_happens:
      - "L'agitation créée par le nombre de personnes présentes qui vont et viennent, le bruit, la lumière et parfois les odeurs (lors des repas)"
