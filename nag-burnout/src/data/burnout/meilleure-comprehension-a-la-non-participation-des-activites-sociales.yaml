title: "Meilleure compréhension à la non participation des activités sociales"
explanation:
  - "Les activités sociales, même ludiques, sont pour moi un effort en soi."
  - "Cela entraîne toujours de la fatigue sociale et peut entraîner selon les cas une surcharge sensorielle ou cognitive."
  - "Bien que je n'aie jamais eu de reproche direct, cela a tout de même été noté une fois lors d'un MAG."
examples:
  - situation: "Events hors des horaires de bureau"
    what_happens:
      - "Ils vont à l'encontre de mon besoin de routine (rentrer plus tard, créer une nouvelle organisation, venir en voiture, ...) et sont source de surcharge cognitive."
  - situation: "Events dans un bar"
    what_happens:
      - "Trop de bruits / de monde, envie de fuir."
  - situation: "Community event (badminton)"
    what_happens:
      - "Dans ce cas, l'activité était pour moi un intérêt spécifique et m'a permis de surmonter le besoin de routine. Mais malgré cela, la fatigue cognitive (changement d'habitudes), sociale (beaucoup de monde, journée longue) et sensorielle (bruit lors de l'apéro/repas) étaient très présentes."
