title: "LENA en remote ou dans une pièce à côté"
explanation:
  - "Participer à une réunion avec un grand nombre de participants dans un espace restreint crée à la fois une surcharge sociale et une surcharge sensorielle."
examples:
  - situation: "Trop de monde dans la pièce (et au long de la journée)"
    what_happens:
      - "Sensation d'oppression, envie de fuir, besoin d'être près de la sortie. Effort intense pour supporter cette situation inconfortable"
  - situation: "Bruits parasites (bouteilles, chuchotements, …)"
    what_happens:
      - 'J''entends tous les bruits de la même manière. L''effort pour rester concentré et "éteindre" le bruit parasite demande également un effort intense'
