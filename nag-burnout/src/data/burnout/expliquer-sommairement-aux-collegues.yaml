title: "Expliquer sommairement aux collègues"
explanation:
  - "La reprise du travail et la confrontation aux autres sont sources d'appréhension."
  - "Expliquer de manière simple et succincte ma situation pourrait aider à éviter certaines situations de stress ou d'incompréhension."
  - "Le but n'est pas de les noyer sous les informations, mais fournir une communication simple sur ce que j'ai vécu et ce que cela implique."
  - 'Une sorte de "Quick User Guide"'
examples:
  - situation: "Éviter la banalisation ou la minimisation"
    what_happens:
      - '"On a tous un peu..." est quelque chose que je ne peux plus accepter. Ce que je vis est difficile, réel et médicalement documenté.'
  - situation: "Augmentation de ma sensibilité"
    what_happens:
      - "Avec l'arrêt du masking, certaines choses qui étaient supportables avant ne le sont plus maintenant"
  - situation: "Communication plus directe ou plus limitée"
    what_happens:
      - "De la même manière, ma façon d'agir ou de communiquer peut avoir changé suite à l'arrêt du masking"
  - situation: "Difficultés voire refus de certaines tâches"
    what_happens:
      - "L'anticipation de la surcharge peut devenir bloquante, à l'image d'une personne qui n'ose plus monter à cheval après une chute"
