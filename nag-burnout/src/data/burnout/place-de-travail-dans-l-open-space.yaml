title: "Place de travail dans l'open space"
explanation:
  - "Certaines places flex à la nag sont pour moi inutilisables. Leur emplacement est source de surcharge sensorielle (besoin de vision globale pour éviter l'imprévu)."
examples:
  - situation: "Flex office"
    what_happens:
      - "J'ai toujours été flex office, mais je me rends compte que c'est parce que j'arrive toujours le premier. L'imprévu de savoir à quelle place m'asseoir est source d'anxiété."
  - situation: "Passage dans le dos"
    what_happens:
      - "Je suis en situation d'alerte permanente. Je ne vois pas ce qu'il y a derrière moi, donc je me retourne au moindre bruit ou je peux être surpris par un collègue qui arrive pour poser une question. Besoin de voir les gens arriver vers moi et sans ambiguïté."
  - situation: "Place occupée"
    what_happens:
      - "Mais en cas de retard de train, j'angoisse à l'idée d'être mal installé."
  - situation: "Place réservée"
    what_happens:
      - "Le respect des règles est important pour moi. Une place réservée peut entraîner une réaction qui va agir sur ma réserve cognitive."
