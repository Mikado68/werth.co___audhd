title: "Pas d'exercices de mise en situation / jeux de rôles"
explanation:
  - "De manière générale, je n'ai pas d'intuition pour les codes sociaux implicites."
  - "Chaque interaction doit être analysée et conscientisée, ce qui est un processus lourd et épuisant."
  - "L'improvisation devient donc une torture pour moi :"
  - "Difficultés à imaginer un scénario sans supports visuels ou règles claires."
  - "Les sous-entendus, le langage non verbal et les règles sociales implicites manquent de précision et créent de l'anxiété."
  - "Gérer plusieurs rôles (le mien et les autres) surcharge mes capacités de traitement."
examples:
  - situation: "Lego Serious Play"
    what_happens:
      - "Difficultés à créer un user journey (ce que peut attendre un utilisateur). J'ai eu à plusieurs reprises envie de quitter le workshop en pleurant."
  - situation: "BIP Workshop - Analyser les émotions d'une personne en fonction de son entrée"
    what_happens:
      - "Devoir analyser les sous-entendus, le langage non verbal et les règles sociales implicites était clairement une demande inadaptée pour moi."
  - situation: "BIP Workshop - Se filmer"
    what_happens:
      - "Être au centre de l'attention, même filmée, génère de l'anxiété."
  - situation: "Samuel me demande de faire une interview filmée pour le blog"
    what_happens:
      - "Quand je reçois le mail, j'angoisse à l'idée de devoir le faire. Ma pensée en arborescence s'active et je m'imagine déjà être obligé ou des reproches. Ce jour-là, j'étais en télétravail, j'ai dû prendre 30 min de pause et discuter avec ma femme. Je me souviens avoir dit être prêt à démissioner si quelqu'un m'obligeait à le faire. Je mis du temps pour la rédaction de la réponse, ce qui a généré un effort supplémentaire."
