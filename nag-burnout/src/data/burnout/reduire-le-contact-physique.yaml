title: "Réduire le contact physique"
explanation:
  - "Le toucher est également affecté par l'hypersensibilité sensorielle."
  - "Un simple contact peut entraîner une surcharge sensorielle."
  - 'Dans le cas où la personne est inconnue, cela provoque de la surprise car mon cerveau n''a pas encore "encodé" la sensation tactile de cette personne spécifique.'
  - "Ce manque de prévisibilité augmente la charge d'adaptation."
examples:
  - situation: "Poignée de main ou bise"
    what_happens:
      - "Bien que socialement acceptée en occident, cela crée en moi une tension, voire une intrusion (si la deuxième main vient se poser sur l'épaule)."
  - situation: "Une tape sur l'épaule ou dans le dos"
    what_happens:
      - 'Mon corps se crispe, encore plus si le geste est "par surprise" (en open space par exemple), je le vis comme une agression. Cela me sort de ma concentration et plusieurs minutes sont nécessaires pour que je reprenne mon activité.'
